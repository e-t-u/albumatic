services:
  albumatic:
    build:
      context: .
      dockerfile: Dockerfile
    image: albumatic:latest
    container_name: albumatic
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

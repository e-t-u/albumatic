[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "albumatic"
version = "6.0.0"
description = "Declarative stamp album page vector layout and PDF generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
albumatic = "albumatic.cli:main"

[tool.setuptools.packages.find]
include = ["albumatic*"]
